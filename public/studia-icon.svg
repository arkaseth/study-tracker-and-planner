  <!-- Inner Academic Cartouche Crest (Nested Squircle) -->
  <path d="M 256 52 C 356 52 406 52 436 82 C 460 106 460 156 460 256 C 460 356 460 406 436 436 C 406 460 356 460 256 460 C 156 460 106 460 82 436 C 52 406 52 356 52 256 C 52 156 52 106 82 82 C 106 52 156 52 256 52 Z" fill="none" stroke="#231934" stroke-opacity="0.18" stroke-width="8"/>
  <path d="M 256 70 C 350 70 398 70 424 96 C 442 114 442 162 442 256 C 442 350 442 398 424 424 C 398 442 350 442 256 442 C 162 442 114 442 96 424 C 70 398 70 350 70 256 C 70 162 70 114 96 96 C 114 70 162 70 256 70 Z" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="6"/>

  <!-- Neoclassical Serif 'S' -->
  <text x="256" y="360" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="305" font-weight="700" text-anchor="middle" fill="#231934" filter="url(#subtle-shadow)" letter-spacing="-4">S</text>
</svg>
