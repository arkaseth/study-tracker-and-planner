<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="studia-pastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddcffc"/>
      <stop offset="50%" stop-color="#cbd5fe"/>
      <stop offset="100%" stop-color="#b8daf8"/>
    </linearGradient>
    <linearGradient id="studia-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.2)"/>
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1530" flood-opacity="0.14"/>
    </filter>
  </defs>

