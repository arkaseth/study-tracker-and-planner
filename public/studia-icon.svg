  <path d="M 256 12 C 378 12 438 12 474 48 C 500 74 500 134 500 256 C 500 378 500 438 474 474 C 438 500 378 500 256 500 C 134 500 74 500 48 474 C 12 438 12 378 12 256 C 12 134 12 74 48 48 C 74 12 134 12 256 12 Z" fill="url(#studia-pastel)"/>

